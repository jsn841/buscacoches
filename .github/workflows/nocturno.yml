name: Análisis nocturno de precios de ocasión

on:
  schedule:
    - cron: "17 1 * * *"   # cada noche, sobre las 3:17 en Madrid (2:17 en invierno)
  workflow_dispatch:
    inputs:
      modo:
        description: "prueba (4 modelos, 2 páginas) o completo (todos los modelos)"
        default: completo
        type: choice
        options: [completo, prueba]
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - ".github/workflows/nocturno.yml"

permissions:
  contents: write

concurrency:
  group: analisis-nocturno
  cancel-in-progress: false

jobs:
  analisis:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt

      - name: Leer anuncios
        env:
          MODO: ${{ github.event_name == 'push' && 'prueba' || inputs.modo || 'completo' }}
        run: |
          python scraper/lector.py --modo "$MODO" --minutos 300 || echo "::error::El lector terminó con error"
          python - <<'PY'
          import json
          d = json.load(open("datos/informe.json"))
          print(f"::notice title=Resumen::{d['modelos_con_datos']} de {d['modelos_pedidos']} modelos con datos en {d['minutos']} min")
          for w, i in d["webs"].items():
              print(f"::notice title={w}::{i['anuncios']} anuncios en {i['modelos_con_anuncios']} modelos, {i['peticiones']} peticiones, errores {i['errores_http']}, {i['resumen']}, bloqueada={i['bloqueada']}")
          PY

      - name: Guardar resultados en el repositorio
        run: |
          set -x
          git config user.name "buscacoches-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p datos/ocasion
          git add -A datos debug 2>&1 || echo "::warning::git add falló"
          if git diff --cached --quiet; then
            echo "::notice::Sin cambios que guardar"
            exit 0
          fi
          git commit -q -m "Datos de ocasión $(date -u +%F) (${{ github.event_name }})"
          for i in 1 2 3; do
            if OUT=$(git pull --rebase origin main 2>&1 && git push origin HEAD:main 2>&1); then
              echo "::notice::Resultados guardados"
              exit 0
            fi
            echo "::warning title=Intento $i::$(echo "$OUT" | tail -5 | tr '\n' ' ')"
            sleep 10
          done
          exit 1
