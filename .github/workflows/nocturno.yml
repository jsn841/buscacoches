name: Análisis nocturno de precios de ocasión

on:
  schedule:
    - cron: "17 1 * * *"   # cada noche, sobre las 3:17 en Madrid (2:17 en invierno)
  workflow_dispatch:
    inputs:
      modo:
        description: "prueba (4 modelos, 2 páginas) o completo (todos los modelos)"
        default: completo
        type: choice
        options: [completo, prueba]
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - ".github/workflows/nocturno.yml"

permissions:
  contents: write

concurrency:
  group: analisis-nocturno
  cancel-in-progress: false

jobs:
  analisis:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt

      - name: Leer anuncios
        env:
          MODO: ${{ github.event_name == 'push' && 'prueba' || inputs.modo || 'completo' }}
        run: python scraper/lector.py --modo "$MODO" --minutos 300

      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "buscacoches-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/ocasion datos/informe.json datos/slugs_webs.json
          [ -d debug ] && git add -A debug || true
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "Datos de ocasión $(date -u +%F) (${{ github.event_name }})"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          exit 1
